<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120e" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · Antenna Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #f2ede3;
        background: #14120e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background: radial-gradient(
          ellipse at 50% 30%,
          #61431630,
          transparent 60%
        );
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
        font-size: 18px;
        font-weight: 550;
        letter-spacing: -0.02em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 1px solid #715328;
        border-radius: 13px;
        background: #382a17;
        color: #ffbb45;
      }
      .brand small {
        display: block;
        margin-top: 4px;
        color: #c1aa7c;
        font-size: 11px;
        letter-spacing: 0.19em;
        font-weight: 400;
      }
      .panel {
        border: 1px solid #584327;
        border-radius: 20px;
        padding: 32px;
        background: #211b13e8;
        box-shadow: 0 24px 80px #0003;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #d7ac65;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
        font-weight: 550;
      }
      .intro {
        margin: 10px 0 28px;
        font-size: 15px;
        color: #b8aa94;
        line-height: 1.7;
      }
      label {
        display: block;
        margin-bottom: 9px;
        font-size: 14px;
        color: #e3d4ba;
      }
      input {
        display: block;
        width: 100%;
        min-height: 49px;
        padding: 12px 14px;
        margin-bottom: 22px;
        font: inherit;
        font-size: 16px;
        color: #f2ede3;
        border: 1px solid #59462b;
        border-radius: 10px;
        background: #15120d;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #ffbb45;
        outline-offset: 3px;
      }
      button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 49px;
        border: 1px solid #ffd27f;
        border-radius: 10px;
        background: #ffbb45;
        color: #241705;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover {
        background: #ffca6c;
      }
      .error {
        border: 1px solid #87533b;
        background: #432a20;
        color: #ffd1b9;
        padding: 12px 14px;
        border-radius: 9px;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 22px;
      }
      @media (max-width: 400px) {
        .panel {
          padding: 25px 21px;
        }
        .brand {
          margin-bottom: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark"
          ><svg
            width="25"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path
              d="M12 10 6 21m6-11 6 11M8 17h8M5 4a10 10 0 0 0 0 13M19 4a10 10 0 0 1 0 13M8 7a6 6 0 0 0 0 7M16 7a6 6 0 0 1 0 7"
            />
            <circle cx="12" cy="10" r="1.5" /></svg
        ></span>
        <div>Antenna<small>OBSERVATORY</small></div>
      </div>
      <section class="panel" aria-labelledby="login-title">
        <p class="eyebrow">Your receiver. Your view.</p>
        <h1 id="login-title">Sign in</h1>
        <p class="intro">Access your aircraft signals and station telemetry.</p>
        <p class="error" role="alert" {{error_hidden}}>{{message}}</p>
        <form method="post" action="/auth/login">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            maxlength="100"
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="1024"
          />
          <button type="submit">
            Sign in <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
